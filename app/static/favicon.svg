<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Grid (4x4 pixels) -->
    <defs>
        <pattern id="pixel-grid" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="none" stroke="#333" stroke-width="0.5"/>
        </pattern>
    </defs>
    
    <!-- Yellow and Blue Pixel Pattern -->
    <g>
        <!-- Row 1 -->
        <rect x="0" y="0" width="8" height="8" fill="#FFD700"/>
        <rect x="8" y="0" width="8" height="8" fill="#0066FF"/>
        <rect x="16" y="0" width="8" height="8" fill="#FFD700"/>
        <rect x="24" y="0" width="8" height="8" fill="#0066FF"/>
        
        <!-- Row 2 -->
        <rect x="0" y="8" width="8" height="8" fill="#0066FF"/>
        <rect x="8" y="8" width="8" height="8" fill="#FFD700"/>
        <rect x="16" y="8" width="8" height="8" fill="#0066FF"/>
        <rect x="24" y="8" width="8" height="8" fill="#FFD700"/>
        
        <!-- Row 3 -->
        <rect x="0" y="16" width="8" height="8" fill="#FFD700"/>
        <rect x="8" y="16" width="8" height="8" fill="#0066FF"/>
        <rect x="16" y="16" width="8" height="8" fill="#FFD700"/>
        <rect x="24" y="16" width="8" height="8" fill="#0066FF"/>
        
        <!-- Row 4 -->
        <rect x="0" y="24" width="8" height="8" fill="#0066FF"/>
        <rect x="8" y="24" width="8" height="8" fill="#FFD700"/>
        <rect x="16" y="24" width="8" height="8" fill="#0066FF"/>
        <rect x="24" y="24" width="8" height="8" fill="#FFD700"/>
    </g>
    
    <!-- Grid Overlay -->
    <rect width="32" height="32" fill="url(#pixel-grid)"/>
</svg> 